name: Deploy Sphinx to GitHub Pages
on:
  push:
    branches: [ main ] 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install sphinx pydata-sphinx-theme myst-nb sphinx-copybutton

      - name: Build HTML
        run: |
          sphinx-build -b html . _build/html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with: # 默认推送到gh-pages
          folder: _build/html # 部署 build 出来的 HTML 文件夹
